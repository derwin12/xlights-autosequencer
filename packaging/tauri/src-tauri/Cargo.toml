[package]
name = "xlight"
version = "0.1.4"
description = "XLight AutoSequencer desktop shell"
authors = ["XLight AutoSequencer"]
edition = "2021"

# The installed binary name (xlightsAI.exe) is intentionally different from
# the Cargo package name above -- renaming the package itself would ripple
# into Cargo.lock and any internal `xlight::` crate paths, whereas [[bin]]
# only changes what the compiled executable is called.
[[bin]]
name = "xlightsAI"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
once_cell = "1"

[features]
# this feature is used for production builds or when `devPath` points to the filesystem
# DO NOT REMOVE!!
custom-protocol = ["tauri/custom-protocol"]
